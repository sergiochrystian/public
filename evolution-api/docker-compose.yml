version: '3.7'

services:
  # ─────────────────────────────────────────
  # Frontend (Seu Site)
  # ─────────────────────────────────────────
  delivery-site:
    image: nginx:alpine
    container_name: delivery-frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ..:/usr/share/nginx/html
    networks:
      - evolution_net

  # ─────────────────────────────────────────
  # Backend (Node.js - Autenticação + Notificações)
  # ─────────────────────────────────────────
  delivery-backend:
    build: ../../backend
    container_name: delivery-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ../../backend/.env
    depends_on:
      - evolution-db
      - evolution-api
    networks:
      - evolution_net

  # ─────────────────────────────────────────
  # Banco de Dados
  # ─────────────────────────────────────────
  evolution-db:
    image: postgres:15-alpine
    container_name: evolution-db
    restart: always
    environment:
      POSTGRES_USER: evolution_user
      POSTGRES_PASSWORD: evolution_password
      POSTGRES_DB: evolution_db
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    networks:
      - evolution_net

  # ─────────────────────────────────────────
  # Cache / Filas (Redis)
  # ─────────────────────────────────────────
  evolution-redis:
    image: redis/redis-stack-server:latest
    container_name: evolution-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - evolution_net

  # ─────────────────────────────────────────
  # Evolution API (WhatsApp)
  # ─────────────────────────────────────────
  evolution-api:
    container_name: evolution-api
    image: atendai/evolution-api:v2.1.1
    restart: always
    ports:
      - "8081:8080"
    environment:
      - SERVER_URL=http://localhost:8081
      - DOCKER_RESTART_POLICY=always
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=my_secure_api_key_123
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO
      - LOG_COLOR=true
      - DELAYS_SEND_MESSAGE=1000,3000
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://evolution_user:evolution_password@evolution-db:5432/evolution_db?sslmode=disable
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - REDIS_ENABLED=false
      - REDIS_URI=redis://evolution-redis:6379
    depends_on:
      - evolution-db
      - evolution-redis
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution_net

networks:
  evolution_net:
    driver: bridge

volumes:
  evolution_db_data:
  evolution_instances:
