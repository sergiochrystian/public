<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery App</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Link abaixo usado para adicionar o ícone atrás do nome cardápio -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<script type="module">
    import { carregarCardapio } from './js/api.js';
    carregarCardapio(); // Isso faz os lanches aparecerem na tela!
</script>

<body>
    <div class="container-principal">
        <header id="store-header">
            <div class="logo-container">
                <img src="assets/logo-kaka-lanches.png" id="store-logo" alt="Logo Loja">
            </div>
            <button id="menu-btn" class="material-symbols-outlined">
                Menu <span class="menu-text">Menu</span>
            </button>
        </header>

        <div id="webapp-cardapio">
            <div class="titulo-cardapio">
                <div class="titulo-cardapio-text">
                    <i class="fa fa-columns icone-cardapio"></i>
                    <span>CARDÁPIO</span>
                </div>
            </div>
        </div>
        
    
        <footer id="cart-footer">
            <div class="cart-info">
                <div class="cart-badge">0</div>
                <span>VER CARRINHO</span>
            </div>
            <div class="cart-total">R$ 0,00</div>
        </footer>

        <script type="module" src="js/api.js"></script>
        <script type="module" src="js/ui.js"></script>

        <script type="module">
            import { carregarCardapio } from './js/api.js';
            carregarCardapio();
        </script>
    </div>
</body>

</html>
